<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Management</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

    <div class="app-container">
        <header>
            <h1>📦 ระบบเบิก-จ่าย</h1>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('receive')">รับเข้า (In)</button>
            <button class="tab-btn" onclick="openTab('issue')">เบิกออก (Out)</button>
            <button class="tab-btn" onclick="openTab('create-qr')">สร้าง QR</button>
        </div>

        <!-- Receive Tab -->
        <div id="receive" class="tab-content active">
            <div class="card">
                <h2>บันทึกรับเข้า</h2>
                <div class="form-group">
                    <label>Items (เลือกหรือพิมพ์ชื่อสินค้า)</label>
                    <input type="text" id="receive-item" list="stock-items"
                        placeholder="พิมพ์ชื่อสินค้า หรือกดเพื่อเลือก">
                </div>
                <div class="form-group">
                    <label>จำนวน</label>
                    <input type="number" id="receive-qty" placeholder="0">
                </div>
                <button class="action-btn" onclick="submitReceive()">บันทึกรับเข้า</button>
            </div>
        </div>

        <!-- Issue Tab -->
        <div id="issue" class="tab-content">
            <div class="card">
                <h2>เบิกออก</h2>

                <div id="reader" width="600px"></div>

                <div class="scan-result" id="scan-result" style="display:none;">
                    <p><strong>Item:</strong> <span id="scan-item-name">-</span></p>
                    <p><strong>คงเหลือ:</strong> <span id="scan-remaining" class="highlight">-</span></p>
                </div>

                <div class="form-group">
                    <label>Items (เลือกหรือพิมพ์ชื่อสินค้า)</label>
                    <input type="text" id="issue-item-input" list="stock-items"
                        placeholder="พิมพ์ชื่อสินค้า หรือกดเพื่อเลือก" onchange="onManualSelectChange()">
                    <datalist id="stock-items">
                        <!-- Options will be populated here -->
                    </datalist>
                </div>

                <div class="form-group">
                    <label>จำนวนที่ต้องการเบิก</label>
                    <input type="number" id="issue-qty" placeholder="0">
                </div>

                <button class="secondary-btn" onclick="startScanner()">📷 เปิดกล้องสแกน</button>
                <button class="action-btn" onclick="submitIssue()">บันทึกเบิกออก</button>
            </div>
        </div>

        <!-- Create QR Tab -->
        <div id="create-qr" class="tab-content">
            <div class="card">
                <h2>สร้าง QR Code</h2>
                <div class="form-group">
                    <label>Items (เลือกหรือพิมพ์ชื่อสินค้า)</label>
                    <input type="text" id="create-qr-item-input" list="stock-items"
                        placeholder="พิมพ์ชื่อสินค้า หรือกดเพื่อเลือก">
                    <!-- Shares the same datalist 'stock-items' -->
                </div>
                <button class="action-btn" onclick="generateQRCode()">สร้าง QR Code</button>

                <div id="qr-code-container" class="qr-container" style="display:none;">
                    <div id="qrcode"></div>
                    <p id="qr-caption"></p>
                </div>
            </div>
        </div>

        <div id="loading-overlay" class="hidden">
            <div class="spinner"></div>
            <p>กำลังบันทึก/โหลดข้อมูล...</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
