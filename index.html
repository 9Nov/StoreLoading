<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกการเบิกของ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ระบบบันทึกการเบิกของ</h1>

        <!-- Authorize Button -->
        <button id="authorize_button" style="display: block;">Authorize with Google</button>

        <!-- Main Content -->
        <div id="main_content" style="display: none;">
            <div class="tabs">
                <button class="tab-button active" onclick="showTab('stock-in')">รับเข้า</button>
                <button class="tab-button" onclick="showTab('stock-out')">เบิกออก</button>
            </div>

            <!-- Stock In Tab -->
            <div id="stock-in" class="tab-content active">
                <h2>รับเข้า</h2>
                <form id="stock-in-form">
                    <div class="form-group">
                        <label for="item-name">Items:</label>
                        <input type="text" id="item-name" required>
                    </div>
                    <div class="form-group">
                        <label for="item-quantity">จำนวน:</label>
                        <input type="number" id="item-quantity" required min="1">
                    </div>
                    <button type="submit">บันทึก</button>
                </form>
            </div>

            <!-- Stock Out Tab -->
            <div id="stock-out" class="tab-content">
                <h2>เบิกออก</h2>
                <div id="qr-reader"></div>
                <div id="scan-result" style="display: none;">
                    <p><strong>QR Code:</strong> <span id="qr-code-text"></span></p>
                    <p><strong>คงเหลือ:</strong> <span id="remaining-quantity"></span></p>
                    <form id="stock-out-form">
                        <div class="form-group">
                            <label for="withdraw-quantity">จำนวนที่ต้องการเบิก:</label>
                            <input type="number" id="withdraw-quantity" required min="1">
                        </div>
                        <button type="submit">เบิกออก</button>
                    </form>
                </div>
            </div>
        </div>
        <div id="loading" class="loading" style="display: none;">กำลังประมวลผล...</div>
    </div>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="script.js"></script>
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</body>
</html>
